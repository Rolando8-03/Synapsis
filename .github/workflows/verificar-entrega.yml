name: Verificación de entrega
on:
  pull_request:
    paths:
      - "**.py"
      - "dist/**"
      - "requirements*.txt"
      - ".github/workflows/verificar-entrega.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  escritorio-windows:
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias del escritorio
        run: python -m pip install -r requirements.txt
      - name: Probar cálculos y ventana desde la entrada Python
        run: |
          python -m unittest discover -s pruebas -q
          python -m pruebas.entrega.arranque
