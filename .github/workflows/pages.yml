name: Publicar Synapsis en GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publicar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m plataformas.web --check
      - run: python -m plataformas.web --output "$RUNNER_TEMP/site"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site
      - uses: actions/deploy-pages@v4
        id: deployment
  verificar:
    needs: publicar
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      QT_QPA_PLATFORM: offscreen
      QTWEBENGINE_DISABLE_SANDBOX: '1'
      QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu --disable-dev-shm-usage
      SITE: https://rolando8-03.github.io/Synapsis/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Esperar la revisión publicada
        run: |
          for i in {1..20}; do
            if curl -fsS --max-time 8 "${SITE}version-compilada.json?sha=$GITHUB_SHA" | jq -e --arg sha "$GITHUB_SHA" '.revision == $sha'; then
              exit 0
            fi
            sleep 5
          done
          echo '::error::Pages no entregó la versión de este commit.'
          exit 1
      - name: Instalar bibliotecas Linux de Qt WebEngine
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libegl1 libgl1 libgbm1 libnss3 libasound2t64 libxkbfile1 libxkbcommon0 libxcb-dri3-0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2
      - run: python -m pip install -r requirements.txt
      - name: Resolver desde la URL pública
        run: python -m plataformas.verificar_web --url "${SITE}?sha=$GITHUB_SHA"
      - name: Repetir el ejercicio desde un clon con servidor estático
        run: python -m plataformas.verificar_web --directorio . --cdn
